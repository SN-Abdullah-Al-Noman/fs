name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt install -y android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs
 
      - name: Mount F2FS image using fuse2fs
        run: |
          IMG_PATH="./FIRMWARE/SM-A536E/odm.img"
          e2fsck -fy ./FIRMWARE/SM-A536E/odm.img
          MOUNT_POINT="/tmp/odm_mount"
          mkdir -p $MOUNT_POINT
          echo "Mounting F2FS image using fuse2fs..."
          fuse2fs $IMG_PATH $MOUNT_POINT
          ls -l $MOUNT_POINT
