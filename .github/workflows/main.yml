name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Nothing
        run: |
          sudo apt install -y repo
          sudo repo init -u https://android.googlesource.com/platform/manifest -b android-16.0.0_r4
          repo sync -j$(nproc) --progress --force-sync
