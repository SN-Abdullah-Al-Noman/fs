name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          blkid -o value -s TYPE odm.img
          ls
          pwd
          ssudo apt install -y p7zip-full lz4 android-sdk-libsparse-utils liblp python3 python3-pip
          simg2img
