name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          blkid odm.img
          ls
          pwd
          sudo cp -v "./bin/simg2img/simg2img" "/usr/local/bin/simg2img"
          sudo chmod 755 "/usr/local/bin/simg2img"
          simg2img
