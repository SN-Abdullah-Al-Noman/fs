name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Nothing
        run: |
          sudo apt install -y repo
          sudo repo init -u git clone https://android.googlesource.com/platform/manifest
          sudo repo sync
