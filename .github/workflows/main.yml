name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies.
        run: |
          sudo apt install -y android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs
 
      - name: Mount F2FS image using fuse2fs.
        run: |
          simg2img ./FIRMWARE/SM-A536E/odm.img ./FIRMWARE/SM-A536E/odm_raw.img
          mkdir -p ./odm_mount
          fuse2fs ./FIRMWARE/SM-A536E/odm_raw.img ./odm_mount
