name: QuantumROM Tools Sixteen

on:
  workflow_dispatch:
    inputs:
      TARGET_DEVICE:
        description: "TARGET_DEVICE_MODEL."
        required: true
        default: "SM-A346E"
      TARGET_DEVICE_CSC:
        description: "TARGET_DEVICE_CSC."
        required: true
        default: "BKD"
      TARGET_DEVICE_IMEI:
        description: "TARGET_DEVICE_IMEI."
        required: false
        default: ""   # optional now
      # ... other inputs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set IMEI based on device
        id: set_imei
        run: |
          declare -A device_imei_map
          device_imei_map=(
            ["SM-A225F"]="123456789012345"
            ["SM-A245F"]="353435774197736"
            ["SM-A346E"]="987654321098765"
          )

          # If TARGET_DEVICE_IMEI is empty, set it automatically
          if [ -z "${{ github.event.inputs.TARGET_DEVICE_IMEI }}" ]; then
            IMEI=${device_imei_map[${{ github.event.inputs.TARGET_DEVICE }}]}
          else
            IMEI=${{ github.event.inputs.TARGET_DEVICE_IMEI }}
          fi

          echo "TARGET_DEVICE_IMEI=$IMEI" >> $GITHUB_ENV

      - name: Show values
        run: |
          echo "Target device: ${{ github.event.inputs.TARGET_DEVICE }}"
          echo "Target IMEI: $TARGET_DEVICE_IMEI"
