name: Build ROM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update packages and install dependencies
        run: |
          sudo apt update
          sudo apt upgrade -y

          sudo apt install -y f2fs-tools

      - name: Load F2FS kernel module
        run: |
          sudo modprobe f2fs

      - name: Verify F2FS support
        run: |
          sload_f2fs
