name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Nothing
        run: |
          sudo apt install -y p7zip-full lz4 android-sdk-libsparse-utils python3 python3-pip zipalign unzip e2fsprogs openjdk-17-jdk >/dev/null 2>&1
          pip3 install liblp tgcrypto pyrogram
          pip3 install git+https://github.com/martinetd/samloader.git
          which lpunpack
          sudo mv /home/runner/.local/bin/lpunpack /usr/local/bin/
          sudo lpunpack
