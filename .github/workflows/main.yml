name: Build ROM

on:
  workflow_dispatch:
  push:
    branches:
      - heroku
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update packages and install dependencies
        run: |
          sudo apt update && sudo apt install -y f2fs-tools linux-modules-extra-$(uname -r) kmod
          sudo modprobe f2fs

      - name: Verify F2FS support
        run: |
          ls -l "$(pwd)"/bin/f2fs-tools
          chmod +x "$(pwd)"/bin/f2fs-tools/mkfs.f2fs
          chmod +x "$(pwd)"/bin/f2fs-tools/sload.f2fs

          dd if=/dev/zero of=system.img bs=512 count=5555556

          sudo "$(pwd)"/bin/f2fs-tools/mkfs.f2fs -f -q \
              -g android \
              -O extra_attr,inode_checksum,sb_checksum,compression \
              -l /system \
              system.img

          sudo "$(pwd)/bin/f2fs-tools/sload.f2fs" \
              -t /system \
              -P \
              -c \
              -L 2 \
              -a lz4 \
              system.img
