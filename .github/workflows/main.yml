name: Build ROM

on:
  workflow_dispatch:
  push:
    branches:
      - heroku
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update packages and install dependencies
        run: |
          sudo apt install -y android-sdk-libsparse-utils f2fs-tools linux-modules-extra-$(uname -r) kmod>/dev/null 2>&1
          sudo modprobe f2fs

      - name: Verify F2FS support
        run: |
          ls
          pwd
          dd if=/dev/zero of=system.img bs=512 count=5555556
          sudo ./bin/f2fs-tools/mkfs.f2fs -f -q -g android -O extra_attr,inode_checksum,sb_checksum system.img
          sudo ./bin/f2fs-tools/sload.f2fs -t /system system.img
