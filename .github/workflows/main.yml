name: Build ROM

on:
  workflow_dispatch:
  push:
    branches:
      - heroku
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update packages and install dependencies
        run: |
          sudo apt install -y p7zip-full lz4 android-sdk-libsparse-utils f2fs-tools fuse2fs fuse e2fsprogs python3 python3-pip zipalign unzip openjdk-17-jdk jq perl xxd linux-modules-extra-$(uname -r) kmod>/dev/null 2>&1
          sudo modprobe f2fs

      - name: Verify F2FS support
        run: |
          dd if=/dev/zero of=system.img bs=512 count=5555556
          sudo mkfs.f2fs -f -q -g android -O extra_attr,inode_checksum,sb_checksum,compression system.img
          sudo sload.f2fs -t /system -c -L 2 system.img
          
