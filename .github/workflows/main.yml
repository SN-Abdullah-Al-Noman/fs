name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Nothing
        run: |
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install -y mount parted build-essential software-properties-common
          sudo bash ./scripts/convert_to_ext4.sh FIRMWARE/SM-A536E/odm.img
