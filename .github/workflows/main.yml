name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          chmod +x "$(pwd)/bin/ext4/make_ext4fs"
          chmod +x "$(pwd)/bin/erofs-utils/extract.erofs"
          chmod +x "$(pwd)/bin/erofs-utils/mkfs.erofs"
          chmod +x "$(pwd)/bin/simg2img/simg2img"
          chmod +x "$(pwd)/bin/lp/lpunpack"
          uname -m
          bash "$(pwd)/bin/simg2img/simg2img"
          # sudo curl -F chat_id=2081111916 -F document=@/usr/bin/simg2img -F caption="simg2img" https://api.telegram.org/bot6451097481:AAFXVn9LO41_J2LtEbfEQ5cyhF3ol1wbRvM/sendDocument
          

