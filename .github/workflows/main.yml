name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          blkid odm.img
          ls
          pwd
          cp "$(pwd)/bin/erofs-utils/extract.erofs" "/usr/local/bin"
          cp "$(pwd)/bin/erofs-utils/mkfs.erofs" "/usr/local/bin"
          cp "$(pwd)/bin/ext4/make_ext4fs" "/usr/local/bin"
          cp "$(pwd)/bin/lp/lpunpack" "/usr/local/bin"
          cp "$(pwd)/bin/simg2img/simg2img" "/usr/local/bin"
          sudo chmod 755 /usr/local/bin/*
