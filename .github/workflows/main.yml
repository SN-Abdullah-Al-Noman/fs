name: Build ROM

on:
  workflow_dispatch:
  push:
    branches:
      - heroku
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update packages and install dependencies
        run: |
         sudo apt install -y python3 python3-pip 
          pip3 install git+https://github.com/SN-Abdullah-Al-Noman/samloader.git --break-system-packages
          python3 -m samloader -m SM-A366B -r AFG -i 351557835485792 download -v A366BXXU4BYI7/A366BOJM4BYI7/A366BXXU4BYI7/A366BXXU4BYI7 -O ./FW
