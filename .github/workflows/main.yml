name: QuantumROM Tools

on:
  push:
    branches:
      - heroku

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
         df . | awk 'NR==2 {printf "%.0f\n", $4/1024/1024}'
          

